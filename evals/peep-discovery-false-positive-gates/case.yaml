schema_version: "1.1"
name: peep-discovery-false-positive-gates
description: |
  Command under test: /bruhs:peep

  Preconditions: User is on branch pay-31-bulk-approve-refunds; PR #57 (Closes PAY-31) has no review comments, and the prompt pre-answers the AI Review question with the full review. bruhs:state points Linear at linear-pay, where PAY-31 lists the acceptance criteria (only refund:write users may approve; one ledger entry per approval; the multiselect hides unmatched items on every admin page by design). The PR body's Risks section says 'the shared multiselect now hides unmatched items while searching on every admin page; intended'. The world plants four candidates for the reviewer subagents to propose: (a) a question whether the global multiselect change is intentional (answered by the Risks section); (b) a citation of src/lib/legacy/guards.ts, which a stale comment in src/routes/admin/exports.ts points at but which does not exist; (c) a must-fix that the bulk handler double-posts when `refund.status === 'approved'` and `settledAt` is null, which a repro can only build with `db.raw.insert*`, because the only writer (approveRefund) sets settledAt in the same transaction that sets approved; (d) the new `POST /admin/refunds/bulk` handler never calls `authorize(user, 'refund:write')` (a user with no permissions gets 200 and approves refunds), while the existing `POST /admin/exports` handler on main also skips it. The run cannot force reviewers to propose (a) to (c), so their graders pass when the candidate never comes up and check the gate when it does.

  Workspace files the preconditions assume: CLAUDE.md, src/routes/admin/refunds.ts, src/routes/admin/exports.ts, src/refunds/approve.ts. scaffold.sh builds the repo, origin and gh fixtures; mocks/linear-pay serves PAY-31.
expected_outcome: |
  - Before reviewing, it reads the PR #57 body and fetches the linked ticket PAY-31 from Linear, builds an intent summary that includes the acceptance criteria and the stated multiselect risk, and passes that intent to the reviewer subagents.
  - No finding shown to the user asks whether hiding unmatched multiselect items on every admin page is intentional; if a reviewer proposes that question, the run drops it because the PR body's Risks section (and PAY-31) already answer it.
  - No finding shown to the user cites src/lib/legacy/guards.ts (or any other file that does not exist) as a pattern or reference. If a reviewer cites such a path, the run checks it (ls, grep or a file read), finds it missing, and removes the citation instead of forwarding it.
  - The claim that the bulk handler double-posts a ledger entry for a refund with status 'approved' and null settledAt is not presented as a confirmed bug. If it is raised, the validator or the run rejects it because that state is unreachable in production: approveRefund, the only writer, sets status and settledAt together in one transaction, and a repro built with db.raw.insert proves nothing about real data. (Noting the branch as dead code is fine.)
  - It reports that `POST /admin/refunds/bulk` never calls `authorize(user, 'refund:write')`, so a user without that permission can approve refunds, as a blocking issue (must-fix / `issue (blocking)`), with evidence such as a test or call that gets 200 for a user with no permissions.
  - The matching gap in the pre-existing `POST /admin/exports` handler (src/routes/admin/exports.ts, no authorize call) is surfaced as its own second finding or a named follow-up, not used as a reason to excuse the bulk handler.
  - It closes with a 🛑 Block verdict that names the missing refund:write authorization on the bulk endpoint as what unblocks it, stated against the PR #57 head SHA it recorded (for example from `gh pr view 57 --json headRefOid`).
context:
  scaffold_script: scaffold.sh
