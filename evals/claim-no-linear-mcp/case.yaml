schema_version: "1.1"
name: claim-no-linear-mcp
description: |
  Command under test: /bruhs:claim

  Preconditions: TypeScript Hono API project ('payments-api': hono, zod, vitest, Dockerfile), git initialized, biome.json present, no bruhs config. ~/.claude.json lists MCP servers notion and context7 but none whose name contains 'linear', and no other agent config lists one. No Linear mock server exists in this case.

  The prompt pre-confirms the stack because a headless run ends at the first
  question.
expected_outcome: |
  - Step 3 runs detect_mcp_servers.py (or reads ~/.claude.json), finds zero Linear servers (only notion, context7), and logs the hint about adding mcp-server-linear
  - Skips Step 4 entirely — does not call any mcp__linear-* tools, does not ask workspace/team/project questions
  - Detects the Hono / zod / vitest / Biome stack and, pre-confirmed, writes the bruhs:state block to CLAUDE.md and AGENTS.md, omitting integrations.linear and not listing linear in tooling.mcps
  - Final summary in Step 8 does not list a Linear integration line, and tells the user how to add Linear later
context:
  scaffold_script: scaffold.sh
