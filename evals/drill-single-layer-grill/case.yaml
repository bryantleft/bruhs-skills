schema_version: "1.1"
name: drill-single-layer-grill
description: |
  Command under test: /bruhs:drill

  Preconditions: Python FastAPI billing service with three packages (app/billing, app/search, app/accounts). .github/workflows/ci.yml has one `checks` job with `timeout-minutes: 10` (the CI critical-path cap, docs/adr/0002-ci-ten-minute-cap.md; the job takes about 4 minutes today) running ruff, mypy, pytest --cov and diff-cover --fail-under=78 on changed lines (hard gate). No mutation runner. CONTEXT.md records that the suite is about 1,800 unit tests running in about 22 seconds, and incident INC-41: test_partial_refund passed while asserting nothing and refund_amount() returned the wrong value. Today's tests still include an assertion-free test (tests/accounts/test_settings.py) and a weak `> 0` assertion (tests/billing/test_invoices.py).

  The prompt pre-answers the grilling (a headless run ends at the first
  question), so no rejection arrives and 3d's ADR does not apply.

  Workspace files the preconditions assume: CONTEXT.md, .github/workflows/ci.yml, pyproject.toml, docs/adr/0002-ci-ten-minute-cap.md, app/**, tests/**
expected_outcome: |
  - Skips Phase 1 and Phase 2 and goes straight to Phase 3 grilling on the mutation runner layer
  - Phase 3a: frames the layer concretely: bug class (assertion-free / shallow tests, INC-41), constraint (10-minute CI cap), illustrative gate output (e.g. 'kill ratio on changed lines is 42%, gate is 70%'), and whether this is hard-gate-from-day-1 or advisory-then-baseline
  - Phase 3b: designs the gate more than once: at minimum strict from day 1, ratchet-only, and a scoped pilot on one package, each with threshold, rollout and what-breaks analysis
  - Considers cross-layer fusion: could a strong mutation gate make the coverage gate redundant? Names it explicitly even if rejected
  - Phase 3c: makes an opinionated recommendation that confronts the 10-minute CI cap (a scheduled run with a ratchet, or a per-PR run scoped to changed lines or one package that fits the budget) and names the trade-off
  - Does not draft an ADR rejecting mutation testing on its own, since the user rejected nothing
  - Phase 3e: outputs an adoption plan suitable for /bruhs:cook (what to install, configure and wire into CI), with an exact gate spec, a tests-to-delete list and a rollback plan
  - Does NOT write the CI yaml or install a mutation tool itself
context:
  scaffold_script: scaffold.sh
