schema_version: "1.1"
name: peep-validation-fails
description: |
  Command under test: /bruhs:peep

  Preconditions: The user is on main; PR #42 (branch perdix-140-add-leaderboard, Closes PERDIX-140) has one unresolved must-fix thread from mira-chen on lib/db/queries.ts:45. The bug is real: getTopAgents sorts ascending, so a test asserting "highest winRate first" fails on current code (RED). The reviewer's suggestion block replaces the comparator with `(a, b) => a.winRate > b.winRate`, which still mis-sorts at runtime, so after applying the suggestion as written the repro still fails and GREEN is never reached. (Under a real tsc the suggestion is also TS2345, boolean not assignable to number; the offline typecheck in this repo only parses, so it can't show that.) The existing test only checks the result length.

  The prompt asks for auto-apply of high-confidence fixes and no posting, because a headless run ends at the first question. scaffold.sh builds the repo, origin and gh fixtures; mocks/linear-perdix serves PERDIX-140.
expected_outcome: |
  - For the must-fix thread on lib/db/queries.ts:45, a repro test asserting that getTopAgents returns the highest winRate first is run against the current, unmodified code and FAILS (RED), and that failure output is captured.
  - It applies the reviewer's suggestion as written (the boolean comparator `a.winRate > b.winRate`), re-runs the same repro, sees it still fail, and says plainly that the suggestion does not fix the bug (GREEN not reached), rather than calling the suggestion reproduced or verified.
  - After trying the suggestion, the trial edit to lib/db/queries.ts is reverted and the repro test file it created is deleted, and a `git status` / `git diff` check shows the tree as it was found (or, if cleanup failed, the run says so and reports dirty-cleanup-needed).
  - When it presents the reviewer's suggestion to the user, it is not marked ✓ / reproduced / verified; it is shown as unconfirmed or failed, together with the proposed diff, the RED output on current code, and the still-failing output after the suggestion.
  - Although the user asked to auto-apply high-confidence fixes, the reviewer's suggestion as written is not auto-applied, committed or pushed; it is left for the user's manual review. (A different fix that the run itself took from RED to GREEN may be applied; the failing suggestion may not.)
context:
  scaffold_script: scaffold.sh
