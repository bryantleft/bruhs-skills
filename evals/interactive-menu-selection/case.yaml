schema_version: "1.1"
name: interactive-menu-selection
description: |
  Command under test: interactive

  Preconditions: User invokes /bruhs with no arguments inside a project that already has bruhs:state block in CLAUDE.md. They want to start building a new feature but forgot the exact subcommand.
expected_outcome: |
  - Presents an AskUserQuestion menu listing the bruhs subcommands (spawn, claim, cook, yeet, peep, doodle, dip) without including slop, per SKILL.md
  - Waits for the user's selection before performing any filesystem or git operations
  - After the user picks 'cook', routes to the cook workflow defined in commands/cook.md beginning at Step 0 (check the bruhs:state block in CLAUDE.md)
  - Does not fabricate a feature description — either prompts the user for one or enters cook's interactive sub-flow
