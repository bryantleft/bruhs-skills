schema_version: "1.1"
name: cook-no-config
description: |
  Command under test: /bruhs:cook

  Preconditions: TypeScript (Next.js) project with a hand-written CLAUDE.md but no bruhs:state block in it, no AGENTS.md, and no legacy .claude/bruhs.json, so read_bruhs_block.py prints nothing (it exits 1 with an error on stderr). No Linear server is configured or mocked.

  Workspace files the preconditions assume: CLAUDE.md (without a bruhs block)

  This case is about the Step 0 question. A headless run ends at the first
  question, so the graders check that cook asks the right question with the
  right options and stops; what happens after each answer can't be reached
  in one turn and is not graded. scaffold.sh builds the repo.
expected_outcome: |
  - Step 0 detects the missing config despite the hand-written CLAUDE.md
  - Asks the user, offering 'Run /bruhs:claim (Recommended)' and 'Continue without config' (Linear will be skipped)
  - Stops and waits for the answer: no claim run, no config written, no exploring or building
context:
  scaffold_script: scaffold.sh
