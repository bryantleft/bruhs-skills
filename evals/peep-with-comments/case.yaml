schema_version: "1.1"
name: peep-with-comments
description: |
  Command under test: /bruhs:peep

  Preconditions: User is on branch perdix-140-add-leaderboard with an open PR #42 (Closes PERDIX-140) that has 4 unresolved review threads: a must-fix on lib/db/queries.ts:45 (getTopAgents never sorts by winRate, a real bug), a nit in components/game/leaderboard-card.tsx (magic number 10, also getTopAgents' default), a second suggestion in the same file (show win rate as a percentage), and a question on lib/hooks/use-leaderboard.ts:12 (why poll every 5s; it reuses POLL_MS shared with useGameState). gh CLI is authenticated. The existing test only checks the result length, so it passes on the bug.

  The prompt pre-answers decisions (apply what holds up, commit and push, draft replies without posting) because a headless run ends at the first question. scaffold.sh builds the repo, origin and gh fixtures; mocks/linear-perdix serves PERDIX-140.
expected_outcome: |
  - With no PR number given, it looks up the PR for the current branch (perdix-140-add-leaderboard) with `gh pr view --json ...` (fields such as number, headRefName, url, state, reviewDecision, title) and identifies it as PR #42.
  - It fetches the PR's review threads with the `gh api graphql` reviewThreads query (getting isResolved, path, line and comment author/body) and reports 4 unresolved threads: lib/db/queries.ts:45, two on components/game/leaderboard-card.tsx, and lib/hooks/use-leaderboard.ts:12.
  - Because unresolved threads exist, it goes straight to analyzing those threads. It does not offer or run the zero-comment AI discovery review (no "AI Review" offer, no reviewer-per-changed-file pass).
  - It launches one isolated subagent per unresolved thread (4 in total), all started together in a single batch rather than one after another, and each subagent's brief carries the PR title/description, that thread's comment, its file path and line, categorization instructions, and the reproduction-first evidence instructions.
  - For the must-fix thread on lib/db/queries.ts:45, a test asserting that getTopAgents returns the highest winRate first is run against the current code and FAILS (RED), passes after the sort-by-winRate-descending fix (GREEN), and afterwards the trial fix is reverted and the repro test file deleted, with the subagent reporting a clean `git diff --stat` / `git status`.
  - The per-thread results use the structured format with an EVIDENCE_TIER (alongside REPRO_TEST / REPRO_COMMANDS / RED_OUTPUT / GREEN_OUTPUT where relevant), with the queries.ts must-fix at `reproduced`, the leaderboard-card suggestions (no bug claim) at `fix-validated` or similar non-reproduced tier, and the polling question at `n/a`.
  - Before addressing threads it presents a summary that orders must-fix before suggestions before the question, separates confirmed findings (reproduced / tooling-confirmed) from anything "unconfirmed — reasoning only", and shows each finding's evidence (✓ reproduced, ⚙ fix-validated, n/a, etc.).
  - The reply it drafts for the polling question on lib/hooks/use-leaderboard.ts:12 uses Conventional Comments format (`<label> [decoration]: <subject>`, e.g. `note: ...`) and answers from the code it read: the interval is POLL_MS from lib/game/constants.ts, shared with useGameState.
  - After applying fixes and before committing, it runs the project's full check suite (`npm run typecheck`, `npm run lint` and `npm test`, or the equivalent package.json scripts) on the combined changes, not only the per-fix checks.
  - It commits the applied fixes on perdix-140-add-leaderboard with a Conventional Commits message (e.g. `fix: address PR review feedback`) and pushes the branch.
context:
  scaffold_script: scaffold.sh
