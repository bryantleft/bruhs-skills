schema_version: "1.1"
name: peep-no-comments
description: |
  Command under test: /bruhs:peep

  Preconditions: User is on branch feat/add-profile-page with open PR #73. The reviewThreads query returns zero unresolved threads. CI is green. No prior .claude/.peep-history/PR-73.jsonl exists.
expected_outcome: |
  - Step 1 finds the PR, Step 2 runs the graphql query and counts 0 unresolved threads
  - Step 2a creates .claude/.peep-history/ if missing and loads PR-73.jsonl (empty since no prior runs)
  - Step 3 fires AskUserQuestion with header 'AI Review' offering 'Yes - full review' (subagent per changed file + validator pass), 'Yes - quick scan' (N=3 majority voting over diff), and 'Skip to merge'
  - If 'Yes - full review': runs `gh pr diff 73 --name-only` then spawns one feature-dev:code-reviewer subagent per changed file, ALL in parallel in one tool-call message, each using the file-scoped review prompt with the priority order (bugs > security > perf anti-patterns > edge cases > API contract) and the 'Produce Hard Evidence' reproduction-first block that sets EVIDENCE_TIER (reproduced / tooling-confirmed / fix-validated / unverified). Each bug claim is demonstrated with a RED→GREEN repro before being reported, and any claim whose repro passes on current code is dropped
  - After reviewers return, Step 3a spawns one validator subagent per proposed issue IN PARALLEL with adversarial 'try to falsify this claim' framing — the validator RE-RUNS the reproduction itself (not just re-reasons), reports EVIDENCE_REPLAYED, drops findings where the repro passes on current code (repro-passed-on-current-code), drops validator-rejected findings, and demotes validator-unsure findings to 'Unconfirmed — reasoning only'
  - If 'Yes - quick scan': spawns THREE reviewer subagents in parallel over `gh pr diff 73` output with shuffled file orderings (seeds 1, 2, 3), then merges by consensus — keeps only issues that appear in >=2 of 3 passes (fuzzy-matched by file + line ±3 + summary token overlap), bumps confidence on 3-of-3 agreement, records VOTE_COUNT: n/3, THEN runs the reproduction pass on each surviving bug to assign EVIDENCE_TIER (consensus across opinions is not evidence — a survivor whose repro passes on current code is dropped)
  - Step 5a applies hard category filter — drops `suggestion`-severity issues whose normalized summary matches lint-territory keywords (naming, formatting, import order, magic number without coupling concern, etc.) and logs the dropped count as a debug line
  - Step 5b applies cross-run dedupe against priorFindings — skips findings whose issue_key matches a prior entry with unchanged context_hash and user_action != 'applied'
  - Step 5c appends every shown finding (with eventual user_action and validator_verdict) to .claude/.peep-history/PR-73.jsonl as one JSON object per line, and ensures .claude/.peep-history/ is in .gitignore
  - If 'Skip to merge': jumps straight to Step 12 (gh pr view reviewDecision,mergeable,mergeStateStatus,statusCheckRollup) to check merge readiness
