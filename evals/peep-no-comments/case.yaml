schema_version: "1.1"
name: peep-no-comments
description: |
  Command under test: /bruhs:peep

  Preconditions: User is on branch feat/add-profile-page with open PR #73. The reviewThreads query returns zero threads and there are no reviews. CI is green. No prior .claude/.peep-history/PR-73.jsonl exists. The PR adds src/lib/profile.ts, src/lib/profile.test.ts and src/app/profile/[id]/page.tsx; displayName() renders "Ada undefined" for a user with no last name (a real bug the shipped test misses), and memberSinceDays() has a bare 86_400_000 and a one-letter variable, bait for lint-territory suggestions.

  The prompt pre-answers the AI Review question (full review) and asks for report-only, because a headless run ends at the first question; the quick-scan and skip-to-merge branches are covered by other cases. scaffold.sh builds the repo, origin and gh fixtures.
expected_outcome: |
  - It finds PR #73 for the current branch (feat/add-profile-page), runs the `gh api graphql` reviewThreads query, and concludes there are 0 unresolved review threads.
  - It creates `.claude/.peep-history/` if missing and looks for `.claude/.peep-history/PR-73.jsonl`, treating the missing file as no prior findings.
  - With zero threads it moves into the AI discovery review (the full review the user asked for) instead of stopping with "no comments, nothing to do".
  - It lists the changed files (`gh pr diff 73 --name-only` or equivalent) and launches one reviewer subagent per changed file, all started together in one batch, each brief carrying the priority order (bugs, security, performance anti-patterns, edge cases, API contract) and the reproduction-first evidence instructions with EVIDENCE_TIER.
  - It reports the displayName() bug in src/lib/profile.ts (a user without a last name renders as "Ada undefined") backed by a test that fails on current code (RED) and passes after a fix (GREEN), with the trial fix and the repro test removed afterwards.
  - After the file reviewers return, it launches one validator subagent per proposed issue, together in one batch, each told to try to falsify the claim by re-running the reproduction itself; the run then drops rejected findings and keeps or demotes the rest according to the validator verdicts.
  - No naming, formatting or plain magic-number suggestion (for example about the bare 86_400_000 or the variable `d` in memberSinceDays) appears among the findings shown to the user, and the run reports how many lint-territory suggestions it filtered (a `[debug] filtered N lint-territory suggestions` line or a count in the summary, 0 included).
  - It appends each finding it showed to `.claude/.peep-history/PR-73.jsonl` as one JSON object per line (with fields such as issue_key, context_hash, user_action, validator_verdict and evidence_tier), and makes sure `.claude/.peep-history/` is listed in .gitignore.
  - It closes the review with a ship verdict (✅ Ship, ✅ Ship with follow-ups, or 🛑 Block) and its reason, stated against the head SHA of PR #73 that it recorded (e.g. from `gh pr view 73 --json headRefOid`).
context:
  scaffold_script: scaffold.sh
