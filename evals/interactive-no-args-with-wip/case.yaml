schema_version: "1.1"
name: interactive-no-args-with-wip
description: |
  Command under test: interactive

  Preconditions: User types /bruhs with no args. git status shows uncommitted modifications to three files mid-feature. No branch has been created yet and no Linear ticket exists for the work. In this world: a claimed Next.js app (bruhs:state, Linear on linear-perdix) on main, with unstaged edits to src/lib/tides.ts, src/lib/tides.test.ts and src/app/page.tsx (a feet/metres toggle).

  A headless run ends at the menu question, so the graders check the menu
  and that the working tree is untouched; what yeet or cook would do after a
  pick is not reachable in one turn.
expected_outcome: |
  - Presents the interactive menu (spawn, claim, cook, yeet, peep, doodle, dip, deepen, drill) without auto-selecting yeet or cook based on the dirty working tree
  - Does not stash, stage, commit or modify the working tree before the user picks a command
  - Makes no Linear calls before the pick
  - (Not reachable in one headless turn: what yeet or cook would do after the pick)
context:
  scaffold_script: scaffold.sh
