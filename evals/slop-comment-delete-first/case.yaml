schema_version: "1.1"
name: slop-comment-delete-first
description: |
  Command under test: /bruhs:slop

  Preconditions: deploy.ts has a four-line comment above `await ensureSession(); await confirmEnvironment(env);` explaining that the session must exist before the environment prompt, because the prompt reads the account alias from the session. The method names and their order already say this, and the commit that introduced the order carries the same explanation.

  Workspace files the preconditions assume: scripts/deploy.ts
expected_outcome: |
  - Asks whether the comment is needed at all before rewording it: deletes it and rereads the two calls
  - Concludes the names and call order already tell the reader the sequence, and recommends deleting the comment
  - Treats deletion as a valid answer to 'tighten', and says so in one line
  - Keeps a one-line comment only if, without it, a reader would plausibly reorder the calls and break the prompt
