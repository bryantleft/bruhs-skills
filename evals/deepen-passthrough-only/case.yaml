schema_version: "1.1"
name: deepen-passthrough-only
description: |
  Command under test: /bruhs:deepen

  Preconditions: TypeScript orders dashboard. src/utils contains 14 files: formatDate.ts, formatRelative.ts and parseIsoDate.ts (one-liners over date-fns), capitalize.ts (str[0].toUpperCase()+str.slice(1)), clamp.ts (Math.min/Math.max), isEmpty.ts, sleep.ts, uniq.ts, sum.ts, noop.ts, identity.ts, plus three files that only re-export from another package (lodash.ts from lodash-es, cn.ts from clsx, schema.ts from zod). There are no domain modules in src/utils: every file is a pass-through to a library or a language operator. Each is imported from exactly one file in src/features, except sleep, noop and identity, which nothing imports. There is no CONTEXT.md.

  Workspace files the preconditions assume: src/utils/*, src/features/**

  scaffold.sh builds the repo.
expected_outcome: |
  - Phase 1: applies the deletion test to the pass-through files and finds that deleting any of them moves one line to ONE call site (or zero), not to N: the 'it vanishes' branch of the deletion test
  - Phase 2: produces FEW or ZERO deepening candidates; pass-through modules are deletion/inlining candidates, not interface-design candidates
  - Names the anti-pattern explicitly: pass-through modules with no behavior to hide are not deepening candidates, citing the deletion test
  - Does not invent a domain to wrap these utilities in (no 'TextFormattingModule', 'DateUtils' or 'NumberUtils' grouping)
  - If src/utils has no deepening candidates, says so plainly and does not fabricate entries
context:
  scaffold_script: scaffold.sh
