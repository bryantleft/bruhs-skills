schema_version: "1.1"
name: drill-happy-path
description: |
  Command under test: /bruhs:drill

  Preconditions: pnpm monorepo with a Next.js + Vitest app in apps/web. The root .github/workflows/ci.yml (GitHub only reads workflows at the repo root) runs Lint, Typecheck, Test (`pnpm test --coverage`) and Build for apps/web; Typecheck has `continue-on-error: true`, added by a commit titled "ci: don't block merges on typecheck while we fix the backlog" whose body says "Temporary". apps/web/vitest.config.ts gates coverage at 40% of total lines (not changed lines), lowered 60 -> 50 -> 40 in two "keep CI green" commits, and excludes all .tsx files and src/components/** from coverage. apps/web/eslint.config.mjs ignores the entire tests/ directory; tests/checkout.test.ts asserts `expect(true).toBe(true)` and has a commented-out test. src/lib/pricing.test.ts only asserts toBeDefined() / > 0. No acceptance-spec runner. No mutation runner. docs/adrs/0007-app-must-not-import-from-marketing.md states a layer rule with no enforcer, and src/app/(app)/dashboard/page.tsx already imports @/marketing/PricingTable. Decoy that is fine: the Lighthouse step is continue-on-error by a documented decision (docs/adrs/0009-lighthouse-is-advisory.md).

  Workspace files the preconditions assume: CLAUDE.md, .github/workflows/ci.yml, apps/web/**, docs/adrs/*

  The run ends at Phase 2's "Which would you like to grill?"; scaffold.sh
  builds the repo and its history.
expected_outcome: |
  - Phase 1: reads the CI workflow as the ground truth, then walks the test tree; does not trust 'green CI' as a proxy for safety
  - Maps each of the 8 layers to its current state (absent / advisory / gated / rotting). At minimum: acceptance specs ABSENT, mutation runner ABSENT, architecture checker ABSENT (ADR exists, enforcer doesn't), test-code linter ABSENT (tests/ excluded from lint), CI orchestrator ROTTING (typecheck in continue-on-error)
  - Applies the discipline-floor rules: coverage at 40% on total lines (not changed lines), lowered twice, is effectively absent / rotting, NOT 'gated'
  - Applies the 'what would slip through' test to each absent or advisory layer, citing evidence from this repo, and does not flag layers where the answer is 'nothing in this codebase'
  - Phase 2: evidence-backed ranked candidates with Layer / Current state / Evidence / Bug class / Proposed adoption / Gating posture / Cross-layer effect / Effort
  - Uses the 8-layer vocabulary exactly
  - Does not count the documented advisory Lighthouse step as orchestrator rot
  - Does NOT propose specific tools (Stryker, Cypress, dependency-cruiser, etc.) in Phase 2
  - Ends Phase 2 with 'Which would you like to grill?'
  - Does NOT write code, install dependencies, or modify CI
context:
  scaffold_script: scaffold.sh
