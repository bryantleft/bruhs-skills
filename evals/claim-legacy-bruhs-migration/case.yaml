schema_version: "1.1"
name: claim-legacy-bruhs-migration
description: |
  Command under test: /bruhs:claim

  Preconditions: Existing project with a legacy .claude/bruhs.json from before the marker-block migration. The JSON has integrations.linear.mcpServer='linear-sonner' with team/project ids, a custom "refactor": "Polish" label, stack.framework='nextjs', stack.styling=['Tailwind CSS','shadcn/ui'], stack.state='zustand' (not in package.json, so re-detection would lose it), tooling.skills=['superpowers','shadcn']. CLAUDE.md exists with hand-written rules and product vision but NO bruhs:state or bruhs:rules block. AGENTS.md does not yet exist.

  Workspace files the preconditions assume: .claude/bruhs.json, CLAUDE.md

  The prompt pre-answers the migrate question ("migrate it over as it is")
  but not the delete question, so a headless run migrates and then ends at
  "delete the legacy file?"; the graders check that it asks and that the file
  is still there. The Yes / No delete branches are not reachable in one turn.
expected_outcome: |
  - Step 1 takes the Case B path (no marker block, but .claude/bruhs.json is present; read_bruhs_block.py prints the legacy JSON as a fallback) and follows the user's pre-answered Migrate choice
  - Pipes the legacy JSON verbatim into sync_bruhs_block.py --kind state — does NOT re-run stack detection, does NOT lose the mcpServer / team / project ids, custom label or stack.state
  - Also pipes the legacy JSON through derive_stack_rules.py | sync_bruhs_block.py --kind rules to populate the rules block
  - Both blocks are written to BOTH CLAUDE.md and AGENTS.md — AGENTS.md is created; the two files end up with identical block contents (mirrored)
  - Hand-written content in CLAUDE.md outside the marker block is preserved verbatim
  - After writing, asks 'Delete the legacy .claude/bruhs.json?' with Yes/No options and waits; the legacy file is still on disk at the end of the run
context:
  scaffold_script: scaffold.sh
