schema_version: "1.1"
name: cook-feature-description
description: |
  Command under test: /bruhs:cook

  Preconditions: Next.js + Drizzle project with an existing bruhs:state block in CLAUDE.md, Linear configured as linear-perdix. Working tree is clean. The game page (src/app/game/[matchId]/page.tsx) and agentStats table (src/db/schema.ts) already exist, as does a top-agents stats page (src/app/stats/page.tsx) whose page size has a receipt (STATS_PAGE_SIZE, top 10 per issue #212) and which looks agents up one at a time in a loop (an N+1 to avoid copying). Pure helpers are unit-tested with node:test (src/lib/agent-record.test.ts). Nothing is installed and there is no browser, so `npm run dev` fails (next: command not found) and no /expect skill or browser MCP exists: visual verification can't run and the run should say so.

  Workspace files the preconditions assume: CLAUDE.md, src/app/game/[matchId]/page.tsx, src/db/schema.ts, src/app/stats/page.tsx, src/lib/stats.ts

  The prompt pre-answers decisions because a headless run ends at the first
  question; scaffold.sh builds the repo and evals/cook-feature-description/mocks/
  serves the linear-perdix tools (none should be called).
expected_outcome: |
  - Step 1 parses 'add a leaderboard to the game page' as a feature description (not a ticket ID), outputs a Feature/Goal/Scope summary, and does NOT call linear_get_issue
  - Step 2 loads practices/engineering-principles.md, practices/type-driven-design.md and typescript-react.md, and dispatches an explorer subagent to find the game page, agentStats schema, and existing stats UI patterns
  - Step 3 presents genuinely distinct approaches only when a real trade-off exists; each plan covers files, data path, landmines, receipts, tripwires, hidden state, and performance, then proceeds with its recommendation as the user asked
  - Step 4 runs git status; since working tree is clean, skips stashing
  - Step 5 builds with TDD in the existing node:test suite and keeps the tests
  - Step 6 launches a reviewer subagent including the fast-path audit for N+1 / await-in-loop / per-request clients; the leaderboard does not copy the stats page's N+1
  - Because the leaderboard is a UI change, the run attempts visual verification per practices/ui-preview.md and, with no browser or dev server available, says plainly it could not verify or capture rather than claiming it did; it does not use the stale Skill('agent-browser')
  - Step 7 runs typecheck, lint and tests, then prints 'Ready to ship! Run /bruhs:yeet to create ticket and PR.' (no existing ticket note)
context:
  scaffold_script: scaffold.sh
