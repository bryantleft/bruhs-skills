schema_version: "1.1"
name: spawn-into-monorepo
description: |
  Command under test: /bruhs:spawn

  Preconditions: Existing Turborepo monorepo 'gambit' with apps/web (Next.js) already in it. User wants to add a new Hono API package as apps/api. Linear is configured.

  In this world: apps/web (Next.js, Drizzle, Better Auth, Zod) and packages/ui; bruhs:state in CLAUDE.md + AGENTS.md uses stack.frameworks ["Next.js"] and Linear on linear-perdix (team PERDIX, project Core). pnpm-workspace.yaml lists "apps/web" by name (not apps/*), so the new app needs adding to it.

  Workspace files the preconditions assume: turbo.json, pnpm-workspace.yaml, CLAUDE.md, AGENTS.md

  The prompt pre-answers the selection flow and Linear, because a headless
  run ends at the first question. A run has no network, so `pnpm create hono`
  can't succeed: the graders check the decisions up to the scaffold command,
  that a failed scaffold is reported plainly, and the repo wiring and state
  merge that don't need the network (the prompt asks to finish the rest).
expected_outcome: |
  - Step 1 detects turbo.json and pnpm-workspace.yaml and takes the add-to-monorepo path with New app (pre-answered), not a new standalone project
  - Uses Type API → TypeScript → Hono at apps/api with Zod, as the user said, without asking again
  - Reuses the existing linear-perdix config and creates a setup ticket for the api app (not a new Linear project)
  - Step 6 chooses `pnpm create hono@latest apps/api` from the monorepo root
  - With no network the scaffold fails; the run says so plainly
  - Extends pnpm-workspace.yaml to include apps/api (it listed apps/web by name)
  - Step 8 merges Hono into the existing bruhs:state block in CLAUDE.md and AGENTS.md (stack.frameworks array becomes Next.js + Hono; database, auth, tooling and Linear ids preserved) rather than overwriting it
context:
  scaffold_script: scaffold.sh
