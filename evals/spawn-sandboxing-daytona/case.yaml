schema_version: "1.1"
name: spawn-sandboxing-daytona
description: |
  Command under test: /bruhs:spawn

  Preconditions: Fresh project (not a monorepo). The whole job of the API is running AI-generated / untrusted user code, so a sandbox is squarely in scope. Linear is configured: ~/.claude.json lists linear-perdix (mock team Perdix, key PERDIX). The workspace is a git repo with only an empty root commit.

  The prompt pre-answers structure, language/framework and Linear, and says
  to take recommended options for the rest, because a headless run ends at
  the first question. It never mentions sandboxing: the case checks that
  spawn brings Daytona up itself. uv and the network are unavailable, so the
  graders check the scaffold command and an honest report of its failure,
  and the config blocks that don't need it.
expected_outcome: |
  - During Step 2e stack selection, spawn brings up Sandboxing with Daytona (asked, or taken as its recommendation since the user said not to wait), because the project is an API that runs AI-generated / untrusted code
  - The written bruhs:state stack includes "sandboxing": ["Daytona"]
  - derive_stack_rules.py emits the Daytona rules block into bruhs:rules — run AI/untrusted code inside a sandbox, reuse-vs-per-call, delete + idle auto-stop, secrets via env, bounded concurrency
  - Both the bruhs:state and bruhs:rules blocks are written to CLAUDE.md and AGENTS.md via the sync helpers
  - Step 6 chooses the uv FastAPI scaffold and reports plainly that it couldn't run
context:
  scaffold_script: scaffold.sh
