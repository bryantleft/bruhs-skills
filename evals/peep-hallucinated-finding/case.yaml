schema_version: "1.1"
name: peep-hallucinated-finding
description: |
  Command under test: /bruhs:peep

  Preconditions: User is on branch feat/paginate-products; PR #42 has no review comments, and the prompt pre-answers the AI Review question with the full review. The changed file src/paginate.ts documents 1-indexed pages but does `const start = page * pageSize` (a genuine off-by-one: paginate([1..6], 1, 2) returns [3,4]). The shipped test only checks the page length, so it passes on the bug. Every caller passes a real array (listProducts() never returns null), so a "possible null deref on items, add an `if (!items) return []` guard" claim, if a reviewer raises one, is fiction: the guard compiles and keeps the tests green, but no repro for it fails on current code. The run cannot force a reviewer to hallucinate that claim, so graders about it pass when no such claim is raised and check the gate when one is.

  scaffold.sh builds the repo, origin and gh fixtures.
expected_outcome: |
  - It reports the off-by-one in src/paginate.ts (page 1 returns the second page) backed by a test asserting page 1 returns the first items that FAILS on current code (RED, e.g. actual [3,4] vs expected [1,2]) and passes after changing the start to `(page - 1) * pageSize` (GREEN), and labels it reproduced.
  - Every bug it presents as confirmed (✓ reproduced or tooling-confirmed) has a captured failure on the current, unmodified code. A claim backed only by "the fix compiles and the existing tests pass" is dropped or shown under "Unconfirmed — reasoning only", never as confirmed.
  - If any reviewer claims `items` can be null/undefined and proposes a guard, the run tries to reproduce it, the repro passes on current code (callers always pass an array), and the claim is dropped rather than reported. If no reviewer raises such a claim, PASS as long as no null-items finding is shown to the user as a confirmed bug.
  - Each proposed issue goes to a validator subagent told to falsify it by re-running the reproduction itself (not only re-reading the code), which reports what it replayed (EVIDENCE_REPLAYED or equivalent) and a verdict; a finding whose repro passes on current code is rejected and dropped.
  - Every repro test and trial fix created during the review is removed, and the working tree ends as it started (a `git status --porcelain` check comes back clean, or the run reports dirty-cleanup-needed for anything it could not restore).
context:
  scaffold_script: scaffold.sh
