schema_version: "1.1"
name: claim-migration-redetect
description: |
  Command under test: /bruhs:claim

  Preconditions: Project has a stale .claude/bruhs.json from a year ago — the recorded stack lists framework='Astro' but the project has since migrated to Next.js (next.config.ts present, astro.config.* removed). CLAUDE.md does not yet contain a bruhs:state block. User wants the new claim to ignore the stale file and re-detect from the current code.

  In this world the legacy file also says database='convex' (now Drizzle), the git history still has astro.config.mjs and convex/, and a CHANGELOG mentions the move. ~/.claude.json lists linear-sonner; the mock has team Son (SON) and project Core.

  Workspace files the preconditions assume: .claude/bruhs.json

  The prompt pre-answers "Re-detect from scratch", the team/project and the
  stack confirmation, but not the delete question, so a headless run writes
  the fresh blocks and ends at "delete the legacy file?". The delete branches
  are not reachable in one turn.
expected_outcome: |
  - Step 1 detects the legacy .claude/bruhs.json via Case B and follows the user's pre-answered 'Re-detect from scratch'
  - Step 2 detects framework='Next.js' and Drizzle from the current code — does NOT carry forward the stale Astro / Convex from the legacy JSON
  - Steps 3–4 find linear-sonner, query teams/projects, and use the team (Son) and project (Core) the user named
  - Step 7 writes the new bruhs:state (and bruhs:rules) block to CLAUDE.md AND AGENTS.md with the freshly detected stack
  - After writing, asks whether to delete the legacy file and waits; the file is still on disk at the end of the run
  - Reports which fields were re-detected vs found empty, so the user can spot what to fill in
context:
  scaffold_script: scaffold.sh
