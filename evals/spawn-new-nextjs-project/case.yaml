schema_version: "1.1"
name: spawn-new-nextjs-project
description: |
  Command under test: /bruhs:spawn

  Preconditions: Empty directory (no turbo.json, no pnpm-workspace.yaml, no package.json). User wants a standalone Next.js + Tailwind + shadcn project with Biome. A Linear MCP 'linear-bnle' is configured in ~/.claude.json (mock team Bnle, key BNLE; one existing project, Core). The workspace is a git repo with only an empty root commit.

  The prompt pre-answers the selection flow and the Linear team/project,
  because a headless run ends at the first question. A run has no network, so
  `pnpm create next-app`, shadcn init and installs can't succeed: the graders
  check the decisions up to the scaffold command and that a failed scaffold is
  reported plainly. Steps 7 (tooling reconciliation), 8 and 10 depend on the
  scaffolder's output and are not graded.
expected_outcome: |
  - Step 1 detects no monorepo markers and skips the 'Add to repo' question
  - Uses the user's pre-answered selections (Single package, Web → TypeScript → Next.js, Tailwind + shadcn/ui, Biome, no database/auth/state) without asking again
  - Step 3/4 detects linear-bnle, calls mcp__linear-bnle__linear_get_teams and uses the Bnle team; creates a new Linear project for my-app with linear_create_project
  - Step 5 creates foundational Linear tickets (initial setup, CI/CD, core deps)
  - Step 6 chooses `pnpm create next-app@latest my-app` (pnpm, never npm/npx/yarn)
  - With no network the scaffold fails; the run says so plainly instead of claiming the project was created
context:
  scaffold_script: scaffold.sh
