schema_version: "1.1"
name: claim-marker-and-legacy-both-present
description: |
  Command under test: /bruhs:claim

  Preconditions: Hybrid state: CLAUDE.md already contains a valid bruhs:state marker block (Case A applies). A legacy .claude/bruhs.json ALSO exists from a previous installation — possibly stale, possibly out of sync with the marker block. This can happen if a user ran an old version of /bruhs:claim, then upgraded the plugin and ran the new version mid-rollout (or merged a branch that re-introduced the legacy file).

  In this world the marker block says Next.js + linear-perdix (team PERDIX) and the stale legacy file says Astro + Convex + linear-sonner (team SON), so any leak of legacy values is visible.

  Workspace files the preconditions assume: CLAUDE.md, AGENTS.md, .claude/bruhs.json

  A headless run ends at the reconfigure question, so the graders check the
  question, the legacy-file note, and that nothing changed before it; the
  Yes / No branches are not reachable in one turn. Mocks for both Linear
  servers exist so a premature Linear call would show up.
expected_outcome: |
  - Case A takes priority: Step 1's probe finds the marker block, so claim asks the Reconfigure question (Yes / No) — NOT the migration prompt (Case B)
  - Calls out the legacy .claude/bruhs.json in a one-line note before / with the question: it is dormant and ignored by read_bruhs_block.py
  - Before the answer: changes nothing (no block writes, no deletion of the legacy file)
  - Never presents the legacy file's values (Astro, Convex, linear-sonner) as current — the marker block always wins
  - (Not reachable in one headless turn: the Yes / No branches and the later delete prompt)
context:
  scaffold_script: scaffold.sh
