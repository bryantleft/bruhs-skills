schema_version: "1.1"
name: slop-python-repo
description: |
  Command under test: /bruhs:slop

  Preconditions: Python FastAPI service. bruhs:state block has stack.framework='fastapi' and stack.language='python'. Code includes an endpoint that constructs a new httpx.AsyncClient() per request, an `await` inside a for loop over independent items, and a SQL query built via f-string interpolation.

  Workspace files the preconditions assume: CLAUDE.md
expected_outcome: |
  - Step 4 loads practices/engineering-principles.md as GOVERNING, then detects language=python and framework=fastapi, loads practices/python.md as the base, stacks practices/python-fastapi.md on top, and still loads practices/type-driven-design.md as PRIMARY plus practices/_common.md
  - Applies the priority hierarchy: Types (P1) > Security (P2) > Performance (P3) > Error Handling (P4) > Architecture (P5) > Immutability (P6) > Style (P7)
  - Flags the f-string SQL query as a P2 Security issue (SQL injection), the per-request httpx.AsyncClient() as a P3 Performance anti-pattern (should be a module-scope singleton), and the await-in-loop as a P3 Performance anti-pattern (use asyncio.gather)
  - Does NOT load practices/typescript-react.md or typescript-hono.md since this is a Python project
  - Static-analysis step uses Python-appropriate tooling (ruff, mypy/ty) rather than ESLint/Biome when running validation in Step 8
