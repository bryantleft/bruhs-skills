schema_version: "1.1"
name: dip-unmerged-branch
description: |
  Command under test: /bruhs:dip

  Preconditions: User is on feature branch feat/experimental with a clean tree. The branch was pushed to origin once and never merged (no PR), and it has one more local commit that was never pushed, so `git branch -d feat/experimental` refuses ("not fully merged"). origin/main has one new teammate commit that isn't fetched yet.

  The case is about asking: a headless run ends at the "Delete anyway?" question, so graders stop there and check that nothing was force-deleted. scaffold.sh builds the repo, origin and gh fixtures.
expected_outcome: |
  - It checks the current branch and working tree (on feat/experimental, clean), detects main as the base branch, switches with `git switch main` and pulls with `git pull origin main`.
  - It tries the safe `git branch -d feat/experimental` first, and git refuses because the branch is not fully merged.
  - On that refusal it asks the user whether to delete the unmerged branch anyway (e.g. "Branch 'feat/experimental' is not fully merged. Delete anyway?"), offering Yes (force delete with `git branch -D`) and No (keep the branch), and stops to wait for the answer.
  - Without an answer from the user it never runs `git branch -D feat/experimental` and never deletes the remote branch (`git push origin --delete feat/experimental`); feat/experimental still exists locally and on origin when the run ends.
context:
  scaffold_script: scaffold.sh
