schema_version: "1.1"
name: peep-loop-until-clean
description: |
  Command under test: /bruhs:peep --loop

  Preconditions: User is on branch feat/retry-api-calls; PR #42 is theirs (gh pr list --author @me lists it), open, with no human review comments, no reviews, and no AI-reviewer bot. CI is green and the project has a node:test harness (npm test). The diff adds src/lib/retry.ts with one reproducible bug (the loop starts at 1, so retry(fn, {attempts: 3}) calls fn only twice; a "fails twice, then succeeds" test throws on current code), one nit (the doc comment says "up to 5 times" while the default is 3), and a follow-on issue the bug fix exposes (after the fix, the backoff also sleeps after the final failed attempt). The shipped test only covers the first-try success path.

  The prompt asks for the full review on each pass and no waiting between iterations, because a headless run ends at the first question. --loop itself authorizes commits and pushes to this branch. scaffold.sh builds the repo, origin and gh fixtures.
expected_outcome: |
  - Each loop iteration's review is peep's own discovery review (reviewer subagents per changed file plus validators, or the three-pass vote), run by the agent itself. It may check the PR for an AI-reviewer bot, but finding none it neither posts a bot mention (such as `@greptile review`) nor waits on one.
  - In the first iteration it fixes the off-by-one in src/lib/retry.ts (the loop starting at 1, so `attempts: 3` calls fn only twice) on the strength of a test that fails on current code (RED) and passes after the fix (GREEN).
  - After applying an iteration's fixes it runs the full check suite (npm test and the other package.json checks), then commits with a message like `fix: self-review pass (peep loop iteration 1)` and pushes to feat/retry-api-calls, before reviewing again.
  - After the first push it reviews again, and the later pass concentrates on what changed since that push (the rewritten retry loop and anything still open) rather than re-litigating the whole diff from scratch.
  - Any finding it cannot reproduce or confirm with a tool is recorded and declined with a reason; it does not apply a no-op or cosmetic change just to make that finding disappear.
  - It stops when a review pass turns up no new actionable findings, or when an iteration applies no new fixes, without inventing an iteration cap of its own, and ends with a per-iteration summary (findings, what was fixed, declined, pushed) and the final state of PR #42.
context:
  scaffold_script: scaffold.sh
