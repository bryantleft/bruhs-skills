schema_version: "1.1"
name: doodle-pr-mode
description: |
  Command under test: /bruhs:doodle

  Preconditions: User is on branch perdix-140-add-leaderboard, which is open as PR #42 on perdix-labs/arena against main. A tldraw MCP is installed exposing mcp__tldraw__create_diagram (the case's mocks/tldraw/ answers with {"path": ".tldraw/diagram.png", "format": "png"}; scaffold.sh writes that file). gh answers for the PR: pr view/list, pr diff 42, api .../pulls/42/files (statuses from the real diff), repo view, gist create and pr comment 42. The PR adds src/leaderboard/query.ts, src/leaderboard/Leaderboard.tsx, src/app/api/leaderboard/route.ts and src/db/client.ts; modifies src/app/page.tsx (now renders Leaderboard instead of the legacy top players) and src/db/schema.ts; and removes src/legacy/top-players.ts. Edge changes: added page.tsx -> leaderboard/Leaderboard, Leaderboard -> query, query -> db/schema and lib/scores, route -> query; removed page.tsx -> legacy/top-players and top-players -> db/schema; preserved page.tsx -> components/Header.

  Workspace files the preconditions assume: src/**

  scaffold.sh builds the repo, the branch, its origin and the gh fixtures.
expected_outcome: |
  - Step 1 verifies the tldraw MCP (loads mcp__tldraw__create_diagram) and does NOT abort
  - Resolves the PR from the current branch via gh and finds PR #42
  - Gets the changed-file list with status (gh api .../pulls/42/files, paginated) and the patch (gh pr diff 42)
  - Groups files into modules (workspace member > layer dir > top-level src/ > extension fallback) and parses imports old (git show <base>:<path>) vs new to compute added/removed/preserved edges
  - Builds tldraw shapes: frames for modules, geo boxes for files (green=added, yellow=modified, red/dashed=deleted), solid green arrows for added edges and dashed red arrows for removed ones
  - Calls mcp__tldraw__create_diagram with shapes, format='png', width=1920, height=1080; receives {path, format}
  - Default upload for pr mode: uploads the image to a gist via `gh gist create` and posts a PR comment on #42 via `gh pr comment 42 --body` with the image and a legend in <details>
context:
  scaffold_script: scaffold.sh
