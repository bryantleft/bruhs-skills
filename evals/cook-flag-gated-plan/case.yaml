schema_version: "1.1"
name: cook-flag-gated-plan
description: |
  Command under test: /bruhs:cook

  Preconditions: Balances are currently visible only to internal staff. The feature exposes them to partner admins (a new audience). It launches behind a flag. Exports to CSV are explicitly out of scope.

  Workspace files the preconditions assume: CLAUDE.md
expected_outcome: |
  - The plan lists CSV export as a non-goal, distinct from any deferred items
  - The plan states the flag-off story: what partner admins see and what happens to any in-flight state if the flag is disabled after launch
  - The plan states the authz model and how submitted fleet ids are scoped to the admin's own tenant
  - Decision-quality checklist items are answered, not just copied
