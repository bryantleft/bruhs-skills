schema_version: "1.1"
name: interactive-invalid-selection
description: |
  Command under test: interactive

  Preconditions: User passes a bogus subcommand 'foo' that is not one of spawn, claim, cook, yeet, peep, dip, doodle, or slop.
expected_outcome: |
  - Recognizes that 'foo' is not a valid bruhs subcommand and does not try to execute a command file that doesn't exist
  - Lists the valid subcommands from SKILL.md (spawn, claim, cook, yeet, peep, dip, doodle, slop) so the user can see what is available
  - Falls back to the interactive AskUserQuestion menu or asks the user to clarify which command they meant
  - Does not create files, run git commands, or call Linear MCP tools while resolving the ambiguity
