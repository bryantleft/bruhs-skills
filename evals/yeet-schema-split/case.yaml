schema_version: "1.1"
name: yeet-schema-split
description: |
  Command under test: /bruhs:yeet

  Preconditions: Prisma + TypeScript loyalty app on main. An uncommitted diff (~120 lines) adds a small reward_grants table (purchase_id, points) via a Prisma migration and schema.prisma, and the grant-on-purchase logic that writes to it (src/rewards/grant.ts, its test, and a call from src/purchases/complete.ts with its test). No PRs exist. The user did not mention splitting. bruhs:state has no Linear integration, so yeet runs git-only. typecheck, lint and test pass.

  The prompt tells the agent to take its recommended option instead of waiting, since a headless run ends at any question, so the split can be carried out. Every push, npm run and gh call (with each PR's base, files, title and body) is recorded in .git/local/ledger.md.

  Workspace files the preconditions assume: prisma/schema.prisma, prisma/migrations/20261103120000_add_reward_grants/migration.sql, src/rewards/grant.ts, src/rewards/grant.test.ts, src/purchases/complete.ts
expected_outcome: |
  - Detects that the diff mixes migration/schema files with application code before committing
  - Stops and offers to split: a schema PR with only the migration and schema.prisma, then the code PR stacked on it
  - Does not waive the split because the diff is small or the migration is one column
  - The schema PR's body says it carries no behavior change
  - The code PR targets the schema branch (stacked) and holds only the application code and tests
context:
  scaffold_script: scaffold.sh
