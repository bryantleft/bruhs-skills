schema_version: "1.1"
name: cook-persists-discovered-skills
description: |
  Command under test: /bruhs:cook

  Preconditions: Next.js + Drizzle storefront. CLAUDE.md and AGENTS.md contain hand-written notes plus a mirrored bruhs:state block with stack.framework='nextjs', tooling.skills=['superpowers','shadcn','vercel-react-best-practices'] and integrations.linear on linear-perdix. A 'stripe-best-practices' skill is checked into the repo at .claude/skills/stripe-best-practices/SKILL.md but is NOT listed in tooling.skills. The feature involves Stripe Checkout, which that skill exists to guide.

  Offline choice: a run loads only bruhs, so find-skills and the three configured skills are not installed, and project config a scaffold writes is not loaded, so the Stripe skill may not appear in the skill list either. The discoverable thing is the repo-vendored SKILL.md; the prompt says a Stripe skill exists in the repo (as a user would) but not where. Graders accept any discovery mechanism and concentrate on the write-back: sync_bruhs_block.py for state, re-derived rules, both files mirrored, other fields and hand-written content preserved. Configured skills that are missing this session must be reported and kept, not dropped.

  Workspace files the preconditions assume: CLAUDE.md, AGENTS.md, .claude/skills/stripe-best-practices/SKILL.md

  The user asks for a plan only, so the run ends at Step 3 and the trace
  stays short enough for a trace judge to see Steps 0-2. scaffold.sh builds
  the repo; mocks/linear-perdix serves Linear (not needed by the graders).
expected_outcome: |
  - Step 0 reads the bruhs:state block via read_bruhs_block.py, finds existing tooling.skills
  - Step 2 tries to load each existing project skill (superpowers, shadcn, vercel-react-best-practices) before exploring and reports the ones not available
  - Searches for additional feature-specific skills given the feature involves Stripe, and discovers stripe-best-practices in .claude/skills/
  - Persists the newly discovered stripe-best-practices skill by piping the updated state JSON into sync_bruhs_block.py --kind state
  - Re-derives the rules block through derive_stack_rules.py into sync_bruhs_block.py --kind rules
  - The state block now lists ['superpowers','shadcn','vercel-react-best-practices','stripe-best-practices'] with every other field unchanged
  - Both CLAUDE.md and AGENTS.md are updated with the same block
  - Hand-written content outside the bruhs blocks is preserved
  - After persisting (still inside Step 2 / Explore), tells the user which skill was added to the state before exploration continues
context:
  scaffold_script: scaffold.sh
