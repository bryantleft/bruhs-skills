schema_version: "1.1"
name: deepen-single-module-grill
description: |
  Command under test: /bruhs:deepen

  Preconditions: TypeScript booking app (Drizzle/Postgres, tested with PGlite per docs/adr/0001; Stripe for deposits). src/reservations/ReservationManager.ts is the shallow module the team wants grilled directly: createReservation(customerId, restaurantId, partySize, date, time, smoking, vip, depositCents, depositRequired, notes, stripePaymentIntentId) and updateReservation(id, partialFields), both forwarding to a ReservationRepository interface with exactly one adapter (DrizzleReservationRepository). Three callers duplicate input validation and disagree: src/api/reservations.ts (party size > 0, date in the future, deposit >= 0), src/admin/reservations.ts (party size 1..20, date today or later, deposit >= 0), src/jobs/reminders.ts (rebooks no-shows; party size > 0, future date). The interface leaks the Stripe PaymentIntent id into the create signature even though only src/api/reservations.ts takes deposits (it creates the intent itself via src/payments/stripe.ts). Existing tests test past the interface: ReservationManager.test.ts asserts arguments reach a repository mock, and the api/admin tests re-test the copied validation. CONTEXT.md is the glossary (Reservation, Party size, Deposit, ...).

  The prompt pre-answers the grilling (a headless run ends at the first
  question) and states a durable rejection: deposits stay in the same
  transaction as their reservation, so no separate deposit service.

  Workspace files the preconditions assume: CONTEXT.md, src/reservations/*, src/api/reservations.ts, src/admin/reservations.ts, src/jobs/reminders.ts, src/payments/stripe.ts
expected_outcome: |
  - Skips Phase 1 and Phase 2 (a module name plus --no-explore) and goes directly to Phase 3 grilling on ReservationManager, reading only that module and its callers
  - Phase 3a frames the candidate concretely: the existing interface (11-argument create with smoking/vip/depositRequired booleans and the PaymentIntent id), the problem, and illustrative caller code, before proposing alternatives
  - Phase 3b designs the interface more than once: at least two distinct alternatives, each with its own dependency strategy and trade-offs
  - Classifies dependencies: Stripe is true-external, the Postgres/Drizzle store is local-substitutable (PGlite)
  - Promotes the scattered party-size / date / deposit invariants into the module (locality win) and hides the Stripe PaymentIntent id behind a Deposit concept (leverage win)
  - Phase 3c makes an opinionated recommendation and cites trade-offs
  - Names the deposit-collection seam and says it has two adapters (Stripe + test fake), while the repository interface with one adapter is not a real seam
  - Phase 3e hand-off includes an implementation plan for /bruhs:cook, a test plan at the new interface, a migration plan for the three callers, and a tests-to-delete list
  - Drafts an ADR recording the user's rejection of a separate deposit service
  - Does not refactor code or write the new module
context:
  scaffold_script: scaffold.sh
