schema_version: "1.1"
name: slop-landmine-tripwire
description: |
  Command under test: /bruhs:slop

  Preconditions: src/profile-client.ts batches ids and fetches profiles from an upstream API with TIMEOUT_MS=5000, MAX_RETRIES=3 (immediate retries on every error, no backoff) and CONCURRENCY=20, none with a receipt. It catches every upstream error per batch, logs it with logger.warn, and returns empty profiles (displayName "") for those ids. A comment says the upstream always returns a userId, but the JSON is cast with `as { profiles: Profile[] }` without validation. Decoy that is fine: MAX_IDS_PER_REQUEST=100 cites docs/upstream-profile-api.md, which states that limit; the doc says nothing about rate limits, quotas or latency.

  Workspace files the preconditions assume: CLAUDE.md, src/profile-client.ts, docs/upstream-profile-api.md

  scaffold.sh builds the repo.
expected_outcome: |
  - Flags TIMEOUT_MS, MAX_RETRIES and CONCURRENCY as missing receipts and does not suggest replacement magic values
  - Names retry amplification and downstream saturation as landmines, including the delayed failure each creates
  - Flags the empty-profile fallback as false success and hidden degraded state
  - Flags the unchecked userId assumption as missing a boundary-validation tripwire
  - Recommends an actionable error or explicit degraded result that states the failed operation, upstream cause, violated policy or assumption, and recovery action
  - Requests measurements, quotas, or capacity math needed to derive the timeout, retry, and concurrency policy
  - Accepts MAX_IDS_PER_REQUEST as receipted by the upstream contract
context:
  scaffold_script: scaffold.sh
