[project]
name = "bruhsbench"
version = "0.1.0"
description = "A/B benchmark harness for the bruhs skill across agent CLIs"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bruhsbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: tests that call real agent CLIs (excluded by default)"]
