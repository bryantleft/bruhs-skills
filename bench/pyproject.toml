[project]
name = "bruhsbench"
version = "0.1.0"
description = "A/B benchmark harness for the bruhs skill across agent CLIs"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "playwright>=1.64.1",
]

[project.scripts]
bruhsbench = "bruhsbench.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bruhsbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/reference/ holds reference solutions (incl. their own test files), not bench tests
addopts = "-m 'not live' --ignore=tests/reference"
markers = [
    "live: tests that call real agent CLIs (excluded by default)",
    "seeded: builds seeded task fixtures (setup.sh: npm ci / cargo build) and grades them; slow",
]
