id = "seed-debug-not-really-fixed"
category = "debug"
# Notes:
# - tests/layout.test.ts is red at bench-base on purpose (390/414/430px): fixing only the
#   breakpoint turns it green while the phone layout stays broken (the naive fix).
# - The debug metric counts regressions (tests passing at base, failing after), not tests
#   already red at base. So a CSS-only fix that works at phone widths (e.g. a media query
#   that stacks the grid, plus min-width: 0 on the line) and leaves those three unit tests
#   red can still score 1 if the hidden tests pass. Accepted: the hidden Playwright test is
#   the arbiter of "fixed".
allowed_paths = ["src/**", "tests/**", "e2e/**", "index.html"]

[checks]
build = "./node_modules/.bin/tsc --noEmit && ./node_modules/.bin/vite build"
typecheck = "./node_modules/.bin/tsc --noEmit"
test = "NODE_OPTIONS=--no-warnings ./node_modules/.bin/vitest run --reporter=json --outputFile=$BRUHSBENCH_REPORT"
# self-contained: production build, `vite preview` on a free port (started by the config's
# webServer), headless Chromium at phone and desktop widths; JUnit report
hidden = "./node_modules/.bin/vite build --logLevel error && HIDDEN_PORT=$(node -e 'const s=require(\"net\").createServer().listen(0,\"127.0.0.1\",()=>{console.log(s.address().port);s.close()})') PLAYWRIGHT_JUNIT_OUTPUT_NAME=$BRUHSBENCH_REPORT ./node_modules/.bin/playwright test -c playwright.hidden.config.ts --reporter=junit"
